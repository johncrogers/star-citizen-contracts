<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contracts</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="overview">
  <header class="top">
    <div>
      <div class="title-row">
        <h1>Contracts</h1>
        <nav class="site-links" id="siteLinks" aria-label="Other sites"></nav>
      </div>
      <p class="meta" id="meta"></p>
    </div>
    <div class="total" id="total"></div>
  </header>

  <nav class="scope" id="tabs" aria-label="View"></nav>

  <section class="toolbar">
    <input id="search" type="search" placeholder="Search contracts: hauling, headhunters, act:mining in:pyro, reward:>100k, is:starter has:blueprint…" autocomplete="off" spellcheck="false">
    <div class="chips" id="systemChips"></div>
  </section>
  <section class="search-only toolbar filters-row">
    <div class="chips" id="actChips"></div>
  </section>
  <section class="search-only toolbar filters-row">
    <label class="sel">Sort <select id="sort"></select></label>
    <label class="sel">Legality <select id="legal"></select></label>
    <div class="fp-flags" id="flagFilters"></div>
    <details class="fp-help" id="help"></details>
  </section>

  <main class="layout">
    <div class="overview" id="overview"></div>
    <ul class="list search-only" id="list"></ul>
    <article class="detail" id="detail"></article>
  </main>

  <script src="site.js"></script>
  <script src="catalog.data.js"></script>
  <script src="activities.data.js"></script>
  <script src="spread.js"></script>
  <script src="app.js"></script>
</body>
</html>
